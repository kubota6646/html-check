<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML自動採点ツール</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-OLBgp1GsljhM2TJ+sbHjaiH9txEUvgdDTAzHv2P24donTt6/529l+9Ua0vFImLlb" crossorigin="anonymous"></script>
  <style>
    /* ===== リセット・基本スタイル ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
      background: #f0f4f8;
      color: #2d3748;
      min-height: 100vh;
    }

    /* ===== ヘッダー ===== */
    header {
      background: linear-gradient(135deg, #2b6cb0, #3182ce);
      color: #fff;
      padding: 1.5rem 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    header p {
      margin-top: 0.25rem;
      font-size: 0.9rem;
      opacity: 0.85;
    }

    /* ===== メインコンテンツ ===== */
    main {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* ===== アップロードエリア ===== */
    #upload-area {
      border: 2.5px dashed #90cdf4;
      border-radius: 12px;
      background: #fff;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    #upload-area.drag-over {
      border-color: #3182ce;
      background: #ebf8ff;
    }

    #upload-area .upload-icon {
      font-size: 3rem;
      margin-bottom: 0.75rem;
    }

    #upload-area p {
      color: #718096;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    #upload-area .upload-hint {
      font-size: 0.8rem;
      color: #a0aec0;
      margin-top: 0.25rem;
    }

    #file-input {
      display: none;
    }

    #select-btn {
      margin-top: 1rem;
      padding: 0.6rem 1.5rem;
      background: #3182ce;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    #select-btn:hover {
      background: #2b6cb0;
    }

    /* ===== ファイルリスト ===== */
    #file-list {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .file-badge {
      background: #bee3f8;
      color: #2b6cb0;
      border-radius: 20px;
      padding: 0.3rem 0.9rem;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .file-badge button {
      background: none;
      border: none;
      color: #2b6cb0;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0;
    }

    /* ===== 採点ボタン ===== */
    #grade-btn {
      display: block;
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.85rem;
      background: #38a169;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #grade-btn:hover {
      background: #276749;
    }

    #grade-btn:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    /* ===== 結果エリア ===== */
    #results-section {
      margin-top: 2rem;
      display: none;
    }

    #results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    #results-header h2 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .export-buttons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    #csv-btn, #xlsx-btn {
      padding: 0.6rem 1.4rem;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    #csv-btn {
      background: #744210;
    }

    #csv-btn:hover {
      background: #5c3317;
    }

    #xlsx-btn {
      background: #276749;
    }

    #xlsx-btn:hover {
      background: #1e4e37;
    }

    /* ===== カード ===== */
    .result-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .card-filename {
      font-size: 1.05rem;
      font-weight: 600;
      color: #2d3748;
      word-break: break-all;
    }

    .card-score {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
    }

    .score-100 { color: #276749; }
    .score-80  { color: #285e61; }
    .score-60  { color: #744210; }
    .score-low { color: #c53030; }

    .card-score span {
      font-size: 1rem;
      font-weight: 500;
      color: #718096;
    }

    /* ===== カテゴリ行 ===== */
    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .category-item {
      background: #f7fafc;
      border-radius: 8px;
      padding: 0.75rem;
    }

    .category-label {
      font-size: 0.8rem;
      color: #718096;
      margin-bottom: 0.3rem;
    }

    .category-score-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .category-score {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .cat-full  { color: #276749; }
    .cat-half  { color: #b7791f; }
    .cat-low   { color: #c53030; }

    /* ===== チェック項目リスト ===== */
    .check-list {
      margin-top: 0.75rem;
      border-top: 1px solid #e2e8f0;
      padding-top: 0.75rem;
    }

    .check-list summary {
      cursor: pointer;
      font-size: 0.9rem;
      color: #4a5568;
      font-weight: 500;
      user-select: none;
    }

    .check-list summary:hover {
      color: #2d3748;
    }

    .check-items {
      margin-top: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .check-item {
      font-size: 0.85rem;
      display: flex;
      align-items: flex-start;
      gap: 0.4rem;
    }

    .check-item .icon { flex-shrink: 0; }
    .check-item .check-body { display: flex; flex-direction: column; gap: 0.2rem; }
    .check-item .reason { color: #718096; }
    .check-item .suggestion {
      display: flex;
      align-items: flex-start;
      gap: 0.3rem;
      background: #ebf8ff;
      border-left: 3px solid #63b3ed;
      border-radius: 4px;
      padding: 0.35rem 0.6rem;
      color: #2c5282;
      font-size: 0.82rem;
      margin-top: 0.1rem;
      white-space: pre-wrap;
    }
    .check-item .suggestion .s-icon { flex-shrink: 0; }

    /* ===== フッター ===== */
    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.8rem;
      color: #a0aec0;
    }
  </style>
</head>
<body>

<header>
  <h1>📝 HTML自動採点ツール</h1>
  <p>HTMLファイルをアップロードして、コード品質を100点満点で採点します</p>
</header>

<main>
  <!-- アップロードエリア -->
  <div id="upload-area" role="region" aria-label="ファイルアップロードエリア">
    <div class="upload-icon">📂</div>
    <p>HTMLファイルをここにドラッグ＆ドロップ</p>
    <p class="upload-hint">または下のボタンからファイルを選択してください（複数選択可）</p>
    <button id="select-btn" type="button">ファイルを選択</button>
    <input type="file" id="file-input" accept=".html,.htm" multiple>
  </div>

  <!-- 選択済みファイル一覧 -->
  <div id="file-list" role="list" aria-label="選択済みファイル一覧"></div>

  <!-- 採点ボタン -->
  <button id="grade-btn" type="button" disabled>採点する</button>

  <!-- 結果エリア -->
  <section id="results-section" aria-label="採点結果">
    <div id="results-header">
      <h2>採点結果</h2>
      <div class="export-buttons">
        <button id="csv-btn" type="button">📥 CSVエクスポート</button>
        <button id="xlsx-btn" type="button">📊 Excelエクスポート</button>
      </div>
    </div>
    <div id="results-container"></div>
  </section>
</main>

<footer>
  <p>HTML自動採点ツール</p>
</footer>

<script>
'use strict';

/* ============================================================
   採点ロジック
   ============================================================ */

/**
 * HTMLテキストを受け取り、採点結果オブジェクトを返す
 * @param {string} html - ファイル内容
 * @returns {object} - 採点結果
 */
function gradeHTML(html) {
  const lines = html.split(/\r?\n/);

  // DOMParser でパース（ブラウザ内）
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');

  const result = {
    categories: {},
    total: 0
  };

  /* ---- ① HTML基本構造（30点） ---- */
  const struct = { label: 'HTML基本構造', max: 30, score: 0, checks: [] };

  const hasDoctype = /<!doctype\s+html\s*>/i.test(html);
  addCheck(struct, '<!DOCTYPE html> がある', hasDoctype, 5,
    '<!DOCTYPE html> 宣言がありません。HTMLファイルの1行目に記述してください。',
    'ファイルの一番先頭（1行目）に次のコードを追加してください：\n<!DOCTYPE html>');

  const htmlTag = html.match(/<html([^>]*)>/i);
  const hasLangInHtml = htmlTag && /lang\s*=/i.test(htmlTag[1]);
  const htmlTagLineNum = findLine(lines, /<html/i);
  addCheck(struct, '<html lang=""> がある', !!hasLangInHtml, 5,
    `${htmlTagLineNum ? htmlTagLineNum + '行目: ' : ''}<html> タグに lang 属性がありません。例: <html lang="ja">`,
    `${htmlTagLineNum ? htmlTagLineNum + '行目の ' : ''}<html> タグを次のように変更してください：\n<html lang="ja">`);

  // DOMParser は <head> と <body> を自動補完するため、元の文字列に対して正規表現で確認する
  const hasHead = /<head[\s>]/i.test(html);
  addCheck(struct, '<head> タグがある', hasHead, 5,
    '<head> タグがありません。',
    '<html> タグの直後に <head> セクションを追加してください：\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>ページタイトル</title>\n</head>');

  const hasBody = /<body[\s>]/i.test(html);
  addCheck(struct, '<body> タグがある', hasBody, 5,
    '<body> タグがありません。',
    '</head> タグの直後に <body> セクションを追加してください：\n<body>\n  <!-- ページのコンテンツをここに書く -->\n</body>');

  const hasMetaCharset = /<meta[^>]+charset\s*=/i.test(html);
  addCheck(struct, '<meta charset> がある', hasMetaCharset, 5,
    '<meta charset> がありません。例: <meta charset="UTF-8">',
    '<head> タグの直後（最初の行）に次のコードを追加してください：\n<meta charset="UTF-8">');

  addCheck(struct, '<title> タグがある', !!doc.querySelector('title'), 5,
    '<title> タグがありません。',
    '<head> 内に次のコードを追加してください：\n<title>ページのタイトル</title>');

  result.categories['HTML基本構造'] = struct;

  /* ---- ② セマンティクス（20点） ---- */
  const sem = { label: 'セマンティクス', max: 20, score: 0, checks: [] };

  const hasHeader = !!doc.querySelector('header');
  const hasMain   = !!doc.querySelector('main');
  const hasFooter = !!doc.querySelector('footer');
  const semanticOk = hasHeader && hasMain && hasFooter;
  const missingSemanticTags = [!hasHeader && '<header>', !hasMain && '<main>', !hasFooter && '<footer>'].filter(Boolean);
  addCheck(sem, '<header> <main> <footer> タグを使っている', semanticOk, 10,
    `不足しているタグ: ${missingSemanticTags.join(', ')}`,
    `<body> 内に不足しているタグを追加してください。基本構造の例：\n<body>\n  <header><!-- ヘッダー --></header>\n  <main><!-- メインコンテンツ --></main>\n  <footer><!-- フッター --></footer>\n</body>`);

  const headings = doc.querySelectorAll('h1,h2,h3,h4,h5,h6');
  const h1Count = doc.querySelectorAll('h1').length;
  const headingOk = (headings.length === 0 || h1Count === 1) && isHeadingHierarchyCorrect(headings);
  const h1Lines = findAllLines(lines, /<h1[\s>]/i);
  const firstHeadingTagName = headings.length > 0 ? headings[0].tagName.toLowerCase() : '';
  const firstHeadingLine = firstHeadingTagName
    ? findLine(lines, new RegExp(`<${firstHeadingTagName}[\\s>]`, 'i'))
    : null;
  const headingReason = h1Count > 1
    ? `<h1> が ${h1Count} 個あります。<h1> は1ページに1つにしてください${lineRef(h1Lines)}`
    : headings.length > 0 && h1Count === 0
      ? '<h1> タグがありません。ページのメインタイトルに <h1> を使ってください。'
      : headings.length > 0 && parseInt(headings[0].tagName[1], 10) !== 1
        ? `<h1> が最初の見出しになっていません。ページ最初の見出しを <h1> にしてください${firstHeadingLine ? `（${firstHeadingLine}行目）` : ''}`
        : '見出し階層が飛んでいます（例: h1 の次に h3）。';
  const headingSuggestion = h1Count > 1
    ? `${lineRef(h1Lines)} の <h1> のうち1つだけ残し、他は <h2> 以降に変更してください。`
    : headings.length > 0 && h1Count === 0
      ? 'ページのメインタイトルを <h1> タグで囲んでください。例：\n<h1>サイトのメインタイトル</h1>'
      : headings.length > 0 && parseInt(headings[0].tagName[1], 10) !== 1
        ? `最初の見出し${firstHeadingLine ? `（${firstHeadingLine}行目）` : ''}を <h1> に変更し、以降の見出しを <h2>、<h3>… の順に並べてください。`
        : '見出しレベルが飛ばないようにしてください。例：h1 → h2 → h3 の順序で使います。h1 の次に h3 を使うのは避けてください。';
  addCheck(sem, '見出し階層が正しい（h1が複数ない等）', headingOk, 5, headingReason, headingSuggestion);

  const images = doc.querySelectorAll('img');
  const imgAltOk = images.length === 0 || Array.from(images).every(img => img.hasAttribute('alt'));
  // Per-line regex works for single-line <img> tags; fall back to all <img> lines for multi-line cases
  const badImgLines = imgAltOk ? [] : (() => {
    const found = findAllLines(lines, /<img\b(?![^>]*\balt\s*=)[^>]*>/i);
    return found.length > 0 ? found : findAllLines(lines, /<img\b/i);
  })();
  addCheck(sem, '<img> タグに alt 属性がある', imgAltOk, 5,
    images.length === 0
      ? '（img タグなし・対象外）'
      : `<img> タグに alt 属性がないものがあります${lineRef(badImgLines)}`,
    images.length === 0
      ? ''
      : `${lineRef(badImgLines)} の <img> タグに alt 属性を追加してください。例：\n<img src="photo.jpg" alt="笑顔の人物写真">`);

  result.categories['セマンティクス'] = sem;

  /* ---- ③ 可読性（25点） ---- */
  const read = { label: '可読性', max: 25, score: 0, checks: [] };

  // インデント統一チェック（スペースとタブが混在していないか）
  const indentedLines = lines.filter(l => /^(\s+)\S/.test(l));
  const hasSpaceIndent = indentedLines.some(l => /^ /.test(l));
  const hasTabIndent   = indentedLines.some(l => /^\t/.test(l));
  const indentOk = !(hasSpaceIndent && hasTabIndent);
  const mixedIndentLines = indentOk ? [] : (() => {
    const spaceLines = findAllLines(lines, /^ /);
    const tabLines   = findAllLines(lines, /^\t/);
    return (spaceLines.length <= tabLines.length ? spaceLines : tabLines);
  })();
  addCheck(read, 'インデントが統一されている', indentOk, 10,
    `スペースとタブが混在しています。どちらか一方に統一してください${lineRef(mixedIndentLines)}`,
    `${lineRef(mixedIndentLines)} のインデントを統一してください。スペース（推奨: 半角スペース2つ）かタブのどちらか一方だけを使うようにしてください。エディタの「タブをスペースに変換」機能を活用すると便利です。`);

  const longLineNums = lines.reduce((acc, l, i) => { if (l.length > 120) acc.push(i + 1); return acc; }, []);
  const longLineOk = longLineNums.length === 0;
  addCheck(read, '1行が120文字以内', longLineOk, 5,
    `120文字を超えている行があります${lineRef(longLineNums)}`,
    `${lineRef(longLineNums)} の行を適切な位置で改行してください。タグの属性が多い場合は次のように複数行に分けると読みやすくなります：\n<a\n  href="https://example.com"\n  class="link"\n  target="_blank"\n  rel="noopener noreferrer"\n>リンクテキスト</a>`);

  const hasComment = /<!--[\s\S]*?-->/.test(html);
  addCheck(read, 'コメントが1つ以上書かれている', hasComment, 5,
    'HTMLコメント（<!-- ... -->）が1つもありません。',
    'コードのセクション区切りや補足説明にコメントを追加してください。例：\n<!-- ナビゲーション -->\n<nav>...</nav>\n\n<!-- メインコンテンツここから -->');

  const consecutiveBlankOk = !/((\r?\n){4,})/.test(html);
  const blankLineStart = (() => {
    if (consecutiveBlankOk) return null;
    let count = 0;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].trim() === '') { count++; if (count >= 3) return i - 1; } else { count = 0; }
    }
    return null;
  })();
  addCheck(read, '連続する空白行が3行以上ない', consecutiveBlankOk, 5,
    `3行以上連続する空白行があります${blankLineStart ? `（${blankLineStart}行目付近）` : ''}`,
    `${blankLineStart ? blankLineStart + '行目付近の' : ''}連続した空白行を削除し、最大2行以内に抑えてください。`);

  result.categories['可読性'] = read;

  /* ---- ④ アクセシビリティ（15点） ---- */
  const a11y = { label: 'アクセシビリティ', max: 15, score: 0, checks: [] };

  const inputs = doc.querySelectorAll('input');
  // ラベルが不要な input タイプを除外する
  const noLabelTypes = ['hidden', 'submit', 'reset', 'button', 'image'];
  const labelableInputs = Array.from(inputs).filter(inp => {
    const type = (inp.getAttribute('type') || 'text').toLowerCase();
    return !noLabelTypes.includes(type);
  });
  let labelOk = true;
  const unlabeledInputLines = [];
  if (labelableInputs.length > 0) {
    labelableInputs.forEach(inp => {
      const id = inp.getAttribute('id');
      const hasLabel = (id && doc.querySelector(`label[for="${id}"]`)) || !!inp.closest('label');
      if (!hasLabel) {
        labelOk = false;
        // Try to find the line by the input's id attribute
        let lineNum = null;
        if (id) {
          const idx = lines.findIndex(l => l.includes(`id="${id}"`) || l.includes(`id='${id}'`));
          if (idx !== -1) lineNum = idx + 1;
        }
        // Fallback: pick next <input> line not already recorded
        if (!lineNum) {
          const allInputLines = findAllLines(lines, /<input\b/i);
          lineNum = allInputLines.find(l => !unlabeledInputLines.includes(l)) || null;
        }
        if (lineNum && !unlabeledInputLines.includes(lineNum)) {
          unlabeledInputLines.push(lineNum);
        }
      }
    });
  }
  addCheck(a11y, '<input> に対応する <label> がある', labelOk, 5,
    labelableInputs.length === 0
      ? '（label が必要な input タグなし・対象外）'
      : `<input> に対応する <label> がない要素があります${lineRef(unlabeledInputLines)}`,
    labelableInputs.length === 0
      ? ''
      : `${lineRef(unlabeledInputLines)} の <input> に対応する <label> を追加してください。例：\n<label for="username">ユーザー名</label>\n<input type="text" id="username" name="username">\n\nまたは <label> で <input> を囲む方法もあります：\n<label>\n  メールアドレス\n  <input type="email" name="email">\n</label>`);

  const anchors = doc.querySelectorAll('a');
  const badTexts = ['こちら', 'here', 'click', 'クリック', 'ここ'];
  let anchorOk = true;
  const badAnchorLines = [];
  Array.from(anchors).forEach(a => {
    const text = (a.textContent || '').trim().toLowerCase();
    if (badTexts.some(bad => text === bad.toLowerCase())) {
      anchorOk = false;
      const aLine = findLine(lines, new RegExp('<a\\b[^>]*>\\s*' + text, 'i'));
      if (aLine && !badAnchorLines.includes(aLine)) badAnchorLines.push(aLine);
    }
  });
  addCheck(a11y, '<a> タグのテキストが意味のある内容', anchorOk, 5,
    `<a> タグのテキストが「こちら」「here」「click」等の不明瞭な文言のみになっています${lineRef(badAnchorLines)}`,
    `${lineRef(badAnchorLines)} のリンクテキストをリンク先の内容が分かる文言に変更してください。例：\n❌ <a href="about.html">こちら</a>\n✅ <a href="about.html">会社概要ページへ</a>`);

  const langOk = !!hasLangInHtml;
  addCheck(a11y, '<html> タグに lang 属性がある', langOk, 5,
    '<html lang="ja"> などの lang 属性を追加してください。',
    `${htmlTagLineNum ? htmlTagLineNum + '行目の ' : ''}<html> タグを次のように変更してください：\n<html lang="ja">`);

  result.categories['アクセシビリティ'] = a11y;

  /* ---- ⑤ ベストプラクティス（10点） ---- */
  const bp = { label: 'ベストプラクティス', max: 10, score: 0, checks: [] };

  const hasInlineStyle = doc.querySelector('[style]') !== null;
  const inlineStyleLines = hasInlineStyle ? findAllLines(lines, /\bstyle\s*=\s*["']/i) : [];
  addCheck(bp, 'インラインスタイルを使っていない', !hasInlineStyle, 5,
    `style属性（インラインスタイル）が使われています。外部CSSファイルまたは<style>タグに移してください${lineRef(inlineStyleLines)}`,
    `${lineRef(inlineStyleLines)} の style 属性を削除し、<head> 内の <style> タグまたは外部CSSファイルにまとめてください。例：\n\n変更前: <p style="color: red; font-size: 14px;">\n変更後: <p class="notice">\n\n<style> タグ内に追加:\n.notice { color: red; font-size: 14px; }`);

  // HTML5 で再定義された <b><i><u> は除外し、真に非推奨のタグのみを対象とする
  const deprecatedTags = ['font', 'center', 'strike', 'marquee'];
  const usedDeprecated = deprecatedTags.filter(tag =>
    new RegExp(`<${tag}[\\s>]`, 'i').test(html)
  );
  const deprecatedLineNums = usedDeprecated.flatMap(tag =>
    findAllLines(lines, new RegExp(`<${tag}[\\s>]`, 'i'))
  ).sort((a, b) => a - b);
  const deprecatedSuggestions = {
    font:    '`<font>` の代わりに CSS を使ってください。例：\n変更前: <font color="red" size="3">テキスト</font>\n変更後: <span class="red-text">テキスト</span>\n.red-text { color: red; font-size: 1rem; }',
    center:  '`<center>` の代わりに CSS を使ってください。例：\n変更前: <center>テキスト</center>\n変更後: <div class="centered">テキスト</div>\n.centered { text-align: center; }',
    strike:  '`<strike>` の代わりに HTML5 の適切なタグを使ってください。\n・削除されたコンテンツ（編集履歴など）→ <del>テキスト</del>\n・内容が古くなった・正確でなくなった場合    → <s>テキスト</s>\n例：\n変更前: <strike>テキスト</strike>\n変更後(削除を示す): <del>テキスト</del>\n変更後(無効を示す): <s>テキスト</s>',
    marquee: '`<marquee>` の代わりに CSS アニメーションを使ってください。例：\n変更前: <marquee>スクロールテキスト</marquee>\n変更後: <p class="marquee-text">スクロールテキスト</p>\n\n/* CSS */\n.marquee-text {\n  overflow: hidden;\n  white-space: nowrap;\n  animation: marquee-scroll 5s linear infinite;\n}\n@keyframes marquee-scroll {\n  from { transform: translateX(100%); }\n  to   { transform: translateX(-100%); }\n}'
  };
  const deprecatedSuggestionText = usedDeprecated.length > 0
    ? usedDeprecated.map(t => deprecatedSuggestions[t] || `<${t}> の代わりに代替手段を使用してください。`).join('\n\n')
    : '';
  addCheck(bp, '非推奨タグを使っていない', usedDeprecated.length === 0, 5,
    `非推奨タグが使われています: ${usedDeprecated.map(t => `<${t}>`).join(', ')}${lineRef(deprecatedLineNums)}`,
    deprecatedSuggestionText);

  result.categories['ベストプラクティス'] = bp;

  /* ---- スコア集計 ---- */
  // 各カテゴリのスコア計算（addCheck が加算済みなので合計する）
  let total = 0;
  Object.values(result.categories).forEach(cat => {
    total += cat.score;
  });
  result.total = total;

  return result;
}

/**
 * チェック結果をカテゴリオブジェクトに追加し、スコアを加算する
 */
function addCheck(cat, label, pass, points, reason, suggestion = '') {
  cat.checks.push({ label, pass, points, reason, suggestion });
  if (pass) cat.score += points;
}

/**
 * 最初に一致する行番号（1始まり）を返す。見つからなければ null。
 */
function findLine(lines, regex) {
  for (let i = 0; i < lines.length; i++) {
    if (regex.test(lines[i])) return i + 1;
  }
  return null;
}

/**
 * 一致するすべての行番号（1始まり）の配列を返す
 */
function findAllLines(lines, regex) {
  const nums = [];
  lines.forEach((l, i) => { if (regex.test(l)) nums.push(i + 1); });
  return nums;
}

/**
 * 行番号の参照文字列を生成する（例: 「3・7・12行目」）
 */
function lineRef(nums) {
  if (!nums || nums.length === 0) return '';
  const shown = nums.slice(0, 5);
  return `（${shown.join('・')}行目${nums.length > 5 ? ' 他' : ''}）`;
}

/**
 * 見出し階層の妥当性チェック（h1が最初に来てスキップしていないか）
 */
function isHeadingHierarchyCorrect(headings) {
  if (headings.length === 0) return true;
  const levels = Array.from(headings).map(h => parseInt(h.tagName[1], 10));
  if (levels[0] !== 1) return false;
  for (let i = 1; i < levels.length; i++) {
    if (levels[i] - levels[i - 1] > 1) return false;
  }
  return true;
}

/* ============================================================
   UI ロジック
   ============================================================ */

const uploadArea  = document.getElementById('upload-area');
const fileInput   = document.getElementById('file-input');
const selectBtn   = document.getElementById('select-btn');
const fileList    = document.getElementById('file-list');
const gradeBtn    = document.getElementById('grade-btn');
const resultsSection = document.getElementById('results-section');
const resultsContainer = document.getElementById('results-container');
const csvBtn      = document.getElementById('csv-btn');
const xlsxBtn     = document.getElementById('xlsx-btn');

/** 選択されたファイルのマップ（名前 → File） */
let selectedFiles = new Map();

/** 採点結果の配列 */
let gradingResults = [];

/* ---- ドラッグ＆ドロップ ---- */
uploadArea.addEventListener('dragover', e => {
  e.preventDefault();
  uploadArea.classList.add('drag-over');
});

uploadArea.addEventListener('dragleave', e => {
  if (!e.relatedTarget || !uploadArea.contains(e.relatedTarget)) {
    uploadArea.classList.remove('drag-over');
  }
});

uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('drag-over');
  addFiles(e.dataTransfer.files);
});

uploadArea.addEventListener('click', e => {
  if (e.target === selectBtn || e.target === fileInput) return;
  fileInput.click();
});

selectBtn.addEventListener('click', e => {
  e.stopPropagation();
  fileInput.click();
});

fileInput.addEventListener('change', () => {
  addFiles(fileInput.files);
  fileInput.value = '';
});

/**
 * ファイルリストに追加する
 * @param {FileList} files
 */
function addFiles(files) {
  Array.from(files).forEach(file => {
    if (/\.html?$/i.test(file.name)) {
      selectedFiles.set(file.name, file);
    }
  });
  renderFileList();
  gradeBtn.disabled = selectedFiles.size === 0;
}

/**
 * ファイルバッジを描画する
 */
function renderFileList() {
  fileList.innerHTML = '';
  selectedFiles.forEach((file, name) => {
    const badge = document.createElement('div');
    badge.className = 'file-badge';
    badge.setAttribute('role', 'listitem');
    badge.innerHTML = `
      <span>📄 ${escapeHtml(name)}</span>
      <button type="button" aria-label="${escapeHtml(name)} を削除" data-name="${escapeHtml(name)}">✕</button>
    `;
    badge.querySelector('button').addEventListener('click', () => {
      selectedFiles.delete(name);
      renderFileList();
      gradeBtn.disabled = selectedFiles.size === 0;
    });
    fileList.appendChild(badge);
  });
}

/* ---- 採点ボタン ---- */
gradeBtn.addEventListener('click', async () => {
  gradeBtn.disabled = true;
  gradeBtn.textContent = '採点中...';
  gradingResults = [];
  resultsContainer.innerHTML = '';

  try {
    for (const [name, file] of selectedFiles) {
      const html = await readFileAsText(file);
      const result = gradeHTML(html);
      result.filename = name;
      gradingResults.push(result);
      resultsContainer.appendChild(buildCard(result));
    }

    resultsSection.style.display = 'block';
    resultsSection.scrollIntoView({ behavior: 'smooth' });
  } catch (err) {
    alert(`採点中にエラーが発生しました: ${err.message}`);
  } finally {
    gradeBtn.disabled = false;
    gradeBtn.textContent = '採点する';
  }
});

/**
 * FileReader を Promise 化する
 */
function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error(`ファイル読み込みエラー: ${file.name}`));
    reader.readAsText(file);
  });
}

/* ---- カード生成 ---- */
function buildCard(result) {
  const card = document.createElement('article');
  card.className = 'result-card';

  const scoreClass = result.total >= 90 ? 'score-100'
                   : result.total >= 70 ? 'score-80'
                   : result.total >= 50 ? 'score-60'
                   : 'score-low';

  // ヘッダー行
  const header = document.createElement('div');
  header.className = 'card-header';
  header.innerHTML = `
    <div class="card-filename">📄 ${escapeHtml(result.filename)}</div>
    <div class="card-score ${scoreClass}">${result.total}<span> / 100点</span></div>
  `;
  card.appendChild(header);

  // カテゴリグリッド
  const catGrid = document.createElement('div');
  catGrid.className = 'categories';
  Object.values(result.categories).forEach(cat => {
    const ratio = cat.score / cat.max;
    const cls = ratio >= 1 ? 'cat-full' : ratio >= 0.5 ? 'cat-half' : 'cat-low';
    const icon = ratio >= 1 ? '✅' : ratio >= 0.5 ? '⚠️' : '❌';
    const item = document.createElement('div');
    item.className = 'category-item';
    item.innerHTML = `
      <div class="category-label">${escapeHtml(cat.label)}</div>
      <div class="category-score-row">
        <span>${icon}</span>
        <span class="category-score ${cls}">${cat.score} / ${cat.max}点</span>
      </div>
    `;
    catGrid.appendChild(item);
  });
  card.appendChild(catGrid);

  // チェック詳細（折りたたみ）
  const details = document.createElement('details');
  details.className = 'check-list';
  const summary = document.createElement('summary');
  summary.textContent = 'チェック項目の詳細を見る';
  details.appendChild(summary);

  const itemsDiv = document.createElement('div');
  itemsDiv.className = 'check-items';

  Object.values(result.categories).forEach(cat => {
    const catTitle = document.createElement('div');
    catTitle.style.cssText = 'font-weight:600;font-size:0.85rem;margin-top:0.5rem;color:#4a5568;';
    catTitle.textContent = `【${cat.label}】`;
    itemsDiv.appendChild(catTitle);

    cat.checks.forEach(chk => {
      const div = document.createElement('div');
      div.className = 'check-item';
      const icon = chk.pass ? '✅' : '❌';
      const reasonHtml = chk.pass ? '' : `<span class="reason"> — ${escapeHtml(chk.reason)}</span>`;
      const suggestionHtml = (!chk.pass && chk.suggestion)
        ? `<div class="suggestion"><span class="s-icon">💡</span><span>${escapeHtml(chk.suggestion)}</span></div>`
        : '';
      div.innerHTML = `<span class="icon">${icon}</span><div class="check-body"><span>${escapeHtml(chk.label)}</span>${reasonHtml}${suggestionHtml}</div>`;
      itemsDiv.appendChild(div);
    });
  });

  details.appendChild(itemsDiv);
  card.appendChild(details);

  return card;
}

/* ============================================================
   エクスポート共通ユーティリティ
   ============================================================ */

/** カテゴリキー（採点ロジックで定義された順序に合わせる） */
const CAT_KEYS = ['HTML基本構造', 'セマンティクス', '可読性', 'アクセシビリティ', 'ベストプラクティス'];

/**
 * 採点結果1件から未達成チェック項目と改善提案の文字列を生成する。
 * @param {object} r - 採点結果オブジェクト
 * @returns {{ failedChecks: string, suggestions: string }}
 */
function buildFailureTexts(r) {
  const failedChecks = [];
  const suggestions = [];
  Object.values(r.categories).forEach(cat => {
    cat.checks.forEach(chk => {
      if (!chk.pass) {
        failedChecks.push(`[${cat.label}] ${chk.label}: ${chk.reason}`);
        if (chk.suggestion) suggestions.push(`[${cat.label}] ${chk.suggestion}`);
      }
    });
  });
  return { failedChecks: failedChecks.join('\n'), suggestions: suggestions.join('\n') };
}

/* ---- CSV エクスポート ---- */
csvBtn.addEventListener('click', () => {
  if (gradingResults.length === 0) return;

  const firstResult = gradingResults[0];
  const catHeaders = CAT_KEYS.map(key => {
    const cat = firstResult.categories[key];
    return cat ? `${cat.label}（${cat.max}点満点）` : key;
  });

  const headers = ['ファイル名', '合計点（100点満点）', ...catHeaders, '未達成チェック項目', '改善提案'];

  const rows = gradingResults.map(r => {
    const { failedChecks, suggestions } = buildFailureTexts(r);
    return [
      r.filename,
      r.total,
      ...CAT_KEYS.map(key => {
        const cat = r.categories[key];
        return cat ? `${cat.score} / ${cat.max}` : '';
      }),
      failedChecks,
      suggestions
    ].map(csvEscape).join(',');
  });

  const bom = '\uFEFF'; // Excel用BOM
  const csv = bom + [headers.map(csvEscape).join(','), ...rows].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = 'html_grading_results.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 100);
});

/* ---- Excel（XLSX）エクスポート ---- */
xlsxBtn.addEventListener('click', () => {
  if (gradingResults.length === 0) return;

  const firstResult = gradingResults[0];

  // サマリーシートのカラム構成
  // col 0: ファイル名, col 1: 合計点, col 2: 満点,
  // col 3+ki*2: カテゴリ[ki] 得点, col 4+ki*2: カテゴリ[ki] 満点,
  // col 3+CAT_KEYS.length*2: 未達成チェック項目, col 4+CAT_KEYS.length*2: 改善提案
  const SUMMARY_FAILED_COL = 3 + CAT_KEYS.length * 2;
  const SUMMARY_SUGGEST_COL = SUMMARY_FAILED_COL + 1;

  // ---- シート1: サマリー ----
  const summaryHeaders = [
    'ファイル名',
    '合計点',
    '満点',
    ...CAT_KEYS.flatMap(key => {
      const cat = firstResult.categories[key];
      const label = cat ? cat.label : key;
      return [`${label} 得点`, `${label} 満点`];
    }),
    '未達成チェック項目',
    '改善提案'
  ];

  const summaryRows = gradingResults.map(r => {
    const { failedChecks, suggestions } = buildFailureTexts(r);
    return [
      r.filename,
      r.total,
      100,
      ...CAT_KEYS.flatMap(key => {
        const cat = r.categories[key];
        return cat ? [cat.score, cat.max] : [0, 0];
      }),
      failedChecks,
      suggestions
    ];
  });

  const summaryData = [summaryHeaders, ...summaryRows];
  const summarySheet = XLSX.utils.aoa_to_sheet(summaryData);

  // カラム幅設定
  const CAT_SCORE_WIDTH = 16;
  const CAT_MAX_WIDTH = 8;
  summarySheet['!cols'] = [
    { wch: 30 },  // ファイル名
    { wch: 8 },   // 合計点
    { wch: 6 },   // 満点
    ...CAT_KEYS.flatMap(() => [{ wch: CAT_SCORE_WIDTH }, { wch: CAT_MAX_WIDTH }]),
    { wch: 60 },  // 未達成チェック項目
    { wch: 60 }   // 改善提案
  ];

  // ヘッダー行のスタイル
  const headerStyle = {
    font: { bold: true, color: { rgb: 'FFFFFF' } },
    fill: { fgColor: { rgb: '2B6CB0' } },
    alignment: { horizontal: 'center', wrapText: true }
  };
  summaryHeaders.forEach((_, colIdx) => {
    const cellRef = XLSX.utils.encode_cell({ r: 0, c: colIdx });
    if (summarySheet[cellRef]) {
      summarySheet[cellRef].s = headerStyle;
    }
  });

  // データ行のスコアセルにカラーを適用
  summaryRows.forEach((row, rowIdx) => {
    const r = rowIdx + 1; // 0行目がヘッダーなのでオフセット
    // 合計点セル (col 1)
    const totalCell = summarySheet[XLSX.utils.encode_cell({ r, c: 1 })];
    if (totalCell) {
      totalCell.s = {
        fill: { fgColor: { rgb: scoreColor(row[1], 100) } },
        alignment: { horizontal: 'center' }
      };
    }
    // カテゴリ得点セル
    CAT_KEYS.forEach((_, ki) => {
      const scoreCol = 3 + ki * 2;
      const maxCol   = 4 + ki * 2;
      const scoreCellRef = XLSX.utils.encode_cell({ r, c: scoreCol });
      if (summarySheet[scoreCellRef]) {
        summarySheet[scoreCellRef].s = {
          fill: { fgColor: { rgb: scoreColor(row[scoreCol], row[maxCol]) } },
          alignment: { horizontal: 'center' }
        };
      }
    });
    // 未達成・提案セルは折り返し
    [SUMMARY_FAILED_COL, SUMMARY_SUGGEST_COL].forEach(c => {
      const cellRef = XLSX.utils.encode_cell({ r, c });
      if (summarySheet[cellRef]) {
        summarySheet[cellRef].s = { alignment: { wrapText: true, vertical: 'top' } };
      }
    });
  });

  // ---- シート2: チェック詳細 ----
  const detailHeaders = ['ファイル名', 'カテゴリ', 'チェック項目', '配点', '結果', '理由・改善提案'];
  const detailRows = [];
  gradingResults.forEach(res => {
    Object.values(res.categories).forEach(cat => {
      cat.checks.forEach(chk => {
        detailRows.push([
          res.filename,
          cat.label,
          chk.label,
          chk.points,
          chk.pass ? '✅ 合格' : '❌ 未達成',
          chk.pass ? '' : `${chk.reason}${chk.suggestion ? '\n💡 ' + chk.suggestion : ''}`
        ]);
      });
    });
  });

  const detailData = [detailHeaders, ...detailRows];
  const detailSheet = XLSX.utils.aoa_to_sheet(detailData);

  detailSheet['!cols'] = [
    { wch: 30 }, // ファイル名
    { wch: 20 }, // カテゴリ
    { wch: 35 }, // チェック項目
    { wch: 6 },  // 配点
    { wch: 10 }, // 結果
    { wch: 70 }  // 理由・改善提案
  ];

  // ヘッダー行スタイル
  detailHeaders.forEach((_, colIdx) => {
    const cellRef = XLSX.utils.encode_cell({ r: 0, c: colIdx });
    if (detailSheet[cellRef]) {
      detailSheet[cellRef].s = headerStyle;
    }
  });

  // データ行スタイル
  const DETAIL_RESULT_COL = 4;
  const DETAIL_REASON_COL = 5;
  detailRows.forEach((row, rowIdx) => {
    const r = rowIdx + 1;
    const pass = row[DETAIL_RESULT_COL] === '✅ 合格';
    const resultCellRef = XLSX.utils.encode_cell({ r, c: DETAIL_RESULT_COL });
    if (detailSheet[resultCellRef]) {
      detailSheet[resultCellRef].s = {
        fill: { fgColor: { rgb: pass ? 'C6EFCE' : 'FFC7CE' } },
        font: { color: { rgb: pass ? '276749' : 'C53030' } },
        alignment: { horizontal: 'center' }
      };
    }
    const reasonCellRef = XLSX.utils.encode_cell({ r, c: DETAIL_REASON_COL });
    if (detailSheet[reasonCellRef]) {
      detailSheet[reasonCellRef].s = { alignment: { wrapText: true, vertical: 'top' } };
    }
  });

  // ワークブック作成
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, summarySheet, 'サマリー');
  XLSX.utils.book_append_sheet(wb, detailSheet, 'チェック詳細');

  XLSX.writeFile(wb, 'html_grading_results.xlsx');
});

/**
 * スコア割合に応じた背景色（ARGB 16進数文字列）を返す
 * @param {number} score
 * @param {number} max
 * @returns {string}
 */
function scoreColor(score, max) {
  const ratio = max > 0 ? score / max : 0;
  if (ratio >= 0.9) return 'C6EFCE'; // 緑（高得点）
  if (ratio >= 0.7) return 'FFEB9C'; // 黄（中得点）
  return 'FFC7CE';                    // 赤（低得点）
}

/* ---- ユーティリティ ---- */

/**
 * HTML エスケープ
 */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/**
 * CSV セル値のエスケープ（ダブルクォートで囲む）
 */
function csvEscape(value) {
  const str = String(value);
  if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
    return '"' + str.replace(/"/g, '""') + '"';
  }
  return str;
}
